name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q
      - name: Check tag packs are valid JSON
        run: python -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('tagpacks/*.json')]"
