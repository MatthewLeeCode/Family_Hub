name: Rust Notes domain

on:
  push:
    branches: [main, master, codex/assistant-integration]
    paths: ["domain/**", ".github/workflows/domain.yml"]
  pull_request:
    paths: ["domain/**", ".github/workflows/domain.yml"]

permissions:
  contents: read

jobs:
  domain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: domain
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --bins --locked
